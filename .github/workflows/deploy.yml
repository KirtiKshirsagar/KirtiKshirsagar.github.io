name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Locate static output and add 404 fallback
        id: out
        run: |
          if [ -f .output/public/index.html ]; then
            dir=.output/public
          elif [ -f dist/client/index.html ]; then
            dir=dist/client
          else
            echo "No prerendered index.html found in .output/public or dist/client" >&2
            ls -la . dist .output 2>&1 || true
            exit 1
          fi
          cp "$dir/index.html" "$dir/404.html"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Uploading from $dir"
          ls -la "$dir"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
